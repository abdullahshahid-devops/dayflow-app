stages:
  - validate
  - build
  - security_scan
  - publish

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

validate_dayflow:
  stage: validate
  tags:
    - dayflow-shell
  script:
    - test -f dayflow/index.html
    - grep -qi "<html" dayflow/index.html
    - grep -qi "<title" dayflow/index.html
    - echo "DAYFLOW validation successful"

build_image:
  stage: build
  tags:
    - dayflow-shell
  script:
    - docker build -t "$IMAGE_TAG" .

security_scan:
  stage: security_scan
  tags:
    - dayflow-shell
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln "$IMAGE_TAG"

publish_image:
  stage: publish
  tags:
    - dayflow-shell
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker push "$IMAGE_TAG"
