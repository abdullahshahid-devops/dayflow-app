stages:
  - validate
  - build
  - test
  - security_scan
  - publish
  - deploy

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

validate_dayflow:
  stage: validate
  tags:
    - dayflow-shell
  script:
    - test -f dayflow/index.html
    - grep -qi "<html" dayflow/index.html
    - grep -qi "<title" dayflow/index.html
    - echo "DAYFLOW validation successful"

build_image:
  stage: build
  tags:
    - dayflow-shell
  script:
    - docker build -t "$IMAGE_TAG" .

health_test:
  stage: test
  tags:
    - dayflow-shell
  script:
    - |
      TEST_CONTAINER="dayflow-test-$CI_JOB_ID"

      cleanup() {
        docker rm -f "$TEST_CONTAINER" >/dev/null 2>&1 || true
      }
      trap cleanup EXIT

      docker run -d --name "$TEST_CONTAINER" \
        -p 127.0.0.1::80 "$IMAGE_TAG"

      HOST_PORT=$(docker port "$TEST_CONTAINER" 80/tcp | awk -F: '{print $NF}')

      for i in $(seq 1 15); do
        if curl -fsS "http://127.0.0.1:$HOST_PORT/" >/dev/null; then
          echo "DAYFLOW health test PASSED"
          exit 0
        fi
        sleep 2
      done

      echo "DAYFLOW health test FAILED"
      exit 1

security_scan:
  stage: security_scan
  tags:
    - dayflow-shell
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln "$IMAGE_TAG"

publish_image:
  stage: publish
  tags:
    - dayflow-shell
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker push "$IMAGE_TAG"

deploy_dayflow:
  stage: deploy
  tags:
    - dayflow-shell
  environment:
    name: production
  resource_group: dayflow-production
  script:
    - |
      set -eu

      TEST_CONTAINER="dayflow-deploy-test-$CI_JOB_ID"
      COMPOSE_FILE="$CI_PROJECT_DIR/docker-compose.yaml"

      PREVIOUS_IMAGE_ID=$(docker inspect dayflow --format '{{.Image}}')

      if docker image inspect "$PREVIOUS_IMAGE_ID" >/dev/null 2>&1; then
        PREVIOUS_IMAGE="dayflow:rollback-previous"
        docker tag "$PREVIOUS_IMAGE_ID" "$PREVIOUS_IMAGE"
        echo "Previous deployment saved: $PREVIOUS_IMAGE"
      else
        PREVIOUS_IMAGE="dayflow:rollback-backup"
        docker image inspect "$PREVIOUS_IMAGE" >/dev/null
        echo "Using verified recovery baseline: $PREVIOUS_IMAGE"
      fi

      cleanup() {
        docker rm -f "$TEST_CONTAINER" >/dev/null 2>&1 || true
      }
      trap cleanup EXIT

      rollback() {
        echo "Deployment failed. Restoring previous image..."

        if ! IMAGE_TAG="$PREVIOUS_IMAGE" docker compose \
          -p dayflow-validation -f "$COMPOSE_FILE" up -d --no-build; then
          echo "ROLLBACK FAILED - Docker Compose could not restore the previous image"
          return 1
        fi

        for i in $(seq 1 15); do
          if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
            echo "ROLLBACK SUCCESSFUL"
            return 0
          fi
          sleep 2
        done

        echo "ROLLBACK FAILED - manual investigation required"
        return 1
      }

      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" \
        -u "$CI_REGISTRY_USER" --password-stdin

      docker pull "$IMAGE_TAG"

      docker run -d --name "$TEST_CONTAINER" \
        -p 127.0.0.1::80 "$IMAGE_TAG"

      HOST_PORT=$(docker port "$TEST_CONTAINER" 80/tcp | awk -F: '{print $NF}')

      for i in $(seq 1 15); do
        if curl -fsS "http://127.0.0.1:$HOST_PORT/" >/dev/null; then
          echo "New image validation PASSED"
          break
        fi
        if [ "$i" -eq 15 ]; then
          echo "New image validation FAILED"
          exit 1
        fi
        sleep 2
      done

      if ! IMAGE_TAG="$IMAGE_TAG" docker compose \
        -p dayflow-validation -f "$COMPOSE_FILE" up -d --no-build; then
        rollback
        exit 1
      fi

      for i in $(seq 1 15); do
        if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
          echo "DAYFLOW PRODUCTION DEPLOYMENT SUCCESSFUL"
          exit 0
        fi
        sleep 2
      done

      rollback
      exit 1
