stages:
  - validate
  - build
  - test
  - security_scan
  - publish

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

validate_dayflow:
  stage: validate
  tags:
    - dayflow-shell
  script:
    - test -f dayflow/index.html
    - grep -qi "<html" dayflow/index.html
    - grep -qi "<title" dayflow/index.html
    - echo "DAYFLOW validation successful"

build_image:
  stage: build
  tags:
    - dayflow-shell
  script:
    - docker build -t "$IMAGE_TAG" .

health_test:
  stage: test
  tags:
    - dayflow-shell
  script:
    - |
      TEST_CONTAINER="dayflow-test-$CI_JOB_ID"

      cleanup() {
        docker rm -f "$TEST_CONTAINER" >/dev/null 2>&1 || true
      }
      trap cleanup EXIT

      docker run -d --name "$TEST_CONTAINER" \
        -p 127.0.0.1::80 "$IMAGE_TAG"

      HOST_PORT=$(docker port "$TEST_CONTAINER" 80/tcp | awk -F: '{print $NF}')

      for i in $(seq 1 15); do
        if curl -fsS "http://127.0.0.1:$HOST_PORT/" >/dev/null; then
          echo "DAYFLOW health test PASSED"
          exit 0
        fi
        sleep 2
      done

      echo "DAYFLOW health test FAILED"
      exit 1

security_scan:
  stage: security_scan
  tags:
    - dayflow-shell
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln "$IMAGE_TAG"

publish_image:
  stage: publish
  tags:
    - dayflow-shell
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker push "$IMAGE_TAG"
